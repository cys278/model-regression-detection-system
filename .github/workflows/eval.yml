name: LLM Evaluation Pipeline

on:
  pull_request:
    paths:
      - "prompts/**"
  push:
    paths:
      - "prompts/**"
      - ".github/workflows/eval.yml"

jobs:
  eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run evaluation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python src/eval_runner.py

      - name: Generate report
        run: |
          python generate_report.py

      - name: Send Slack alert
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python send_alert.py

      - name: Fail on critical regression
        run: |
          python - <<'EOF'
          import json
          import glob

          runs = sorted(glob.glob("runs/*.json"))

          if len(runs) < 2:
              print("Not enough runs to compare. Passing.")
              raise SystemExit(0)

          current = json.load(open(runs[-1]))
          previous = json.load(open(runs[-2]))

          delta = current["category_accuracy"] - previous["category_accuracy"]

          if delta <= -0.08:
              raise Exception("Critical regression detected")

          print("No critical regression detected.")
          EOF

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: reports/report_latest.html