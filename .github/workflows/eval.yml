      - name: Run evaluation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONPATH: .
        run: |
          python src/eval_runner.py

      - name: Generate report
        env:
          PYTHONPATH: .
        run: |
          python generate_report.py

      - name: Send Slack alert
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PYTHONPATH: .
        run: |
          python send_alert.py

      - name: Fail on critical regression
        run: |
          python - <<EOF
          import json, glob

          runs = sorted(glob.glob('runs/*.json'))

          if len(runs) < 2:
              print("Not enough runs to compare. Passing.")
              raise SystemExit(0)

          current = json.load(open(runs[-1]))
          previous = json.load(open(runs[-2]))

          def get_status(prev, curr):
              delta = curr["category_accuracy"] - prev["category_accuracy"]
              if delta <= -0.08:
                  return "critical"
              elif delta <= -0.03:
                  return "warning"
              return "pass"

          status = get_status(previous, current)
          print("STATUS:", status)

          if status == "critical":
              raise Exception("Critical regression detected")
          EOF

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: reports/report_latest.html